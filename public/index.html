<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cerulean Search</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=7">
  <link rel="stylesheet" href="/glossary.css?v=2">
</head>
<body>
  <button id="dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>

  <div id="app" class="app landing">

    <header id="landing-header" class="landing-header">
      <div class="wordmark">
        <span class="wm-c">C</span><span class="wm-e">e</span><span class="wm-r">r</span><span class="wm-u">u</span><span class="wm-l">l</span><span class="wm-e2">e</span><span class="wm-a">a</span><span class="wm-n">n</span><span class="wm-glass" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><line x1="15" y1="15" x2="21" y2="21"/></svg></span>
      </div>
      <p class="tagline">Source-classified search</p>
    </header>

    <header id="results-header" class="results-header hidden">
      <button class="home-btn" id="home-btn" title="Back to home">
        <span class="mini-wordmark">Cerulean</span>
        <svg class="mini-glass" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </button>
    </header>

    <main class="main">
      <div class="search-container">
        <div class="search-bar" id="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="q" type="text" placeholder="Search the web…" autocomplete="off" spellcheck="false">
          <button id="go" class="search-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>

        <!-- Primary control row: mode toggle, summarize, provider, overflow -->
        <div id="controls" class="controls hidden">
          <div class="seg" role="radiogroup" aria-label="Ranking mode">
            <button class="seg-btn" data-mode="unfiltered" role="radio" aria-checked="false">Unfiltered</button>
            <button class="seg-btn active" data-mode="boost" role="radio" aria-checked="true">Quality Boost</button>
          </div>

          <button class="chip" id="chip-summarize" data-key="summarize" aria-pressed="false" title="Extractive top sentences from result snippets. No AI involved.">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M2 3h12v1.5H2zM2 7h12v1.5H2zM2 11h8v1.5H2z"/></svg>
            Top sentences
          </button>

          <div class="provider-select">
            <select id="provider" title="Search provider" aria-label="Search provider">
              <option value="brave">Brave</option>
              <option value="serper">Serper</option>
              <option value="ddg">DuckDuckGo</option>
            </select>
          </div>

          <button class="overflow-btn" id="overflow-btn" aria-expanded="false" aria-controls="source-filters" aria-label="More filters" title="More filters">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>
          </button>
        </div>

        <!-- Source-type filter chips, hidden behind overflow trigger -->
        <div id="source-filters" class="source-filters" hidden>
          <button class="src-chip" data-src="news" aria-pressed="false">News</button>
          <button class="src-chip" data-src="academic" aria-pressed="false">Academic</button>
          <button class="src-chip" data-src="community" aria-pressed="false">Forum</button>
          <button class="src-chip" data-src="gov" aria-pressed="false">Official</button>
        </div>
      </div>

      <div id="instant-answer" class="hidden"></div>
      <div id="status" class="status hidden"></div>
      <div id="synthesis" class="synthesis hidden"></div>
      <div id="results" class="results"></div>
    </main>

    <footer id="footer" class="footer">
      <nav class="footer-nav">
        <a href="/why.html">Why Cerulean?</a>
        <span class="dot">·</span>
        <a href="/methodology.html">Methodology</a>
        <span class="dot">·</span>
        <a href="/about.html">About</a>
        <span class="dot">·</span>
        <a href="/how-it-works.html">How It Works</a>
        <span class="dot">·</span>
        <a href="/privacy.html">Privacy</a>
        <span class="dot">·</span>
        <a href="/manifesto.html">Mission Statement</a>
      </nav>
      <a href="/" class="brand-lockup" aria-label="Cerulean home">
        <span class="brand-text">Cerulean</span>
        <svg class="brand-glass" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="10" r="6"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
      </a>
    </footer>
  </div>

  <script src="/app.js?v=8"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/glossary.js?v=2" defer></script>
  <script src="/tier-glossary.js?v=3" defer></script>
</body>
</html>

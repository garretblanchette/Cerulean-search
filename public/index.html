<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cerulean Search</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app landing">

    <!-- Landing header (centered) -->
    <header id="landing-header" class="landing-header">
      <div class="wordmark">
        <span class="wm-c">C</span><span class="wm-e">e</span><span class="wm-r">r</span><span class="wm-u">u</span><span class="wm-l">l</span><span class="wm-e2">e</span><span class="wm-a">a</span><span class="wm-n">n</span>
      </div>
      <p class="tagline">Ad-free, quality-ranked search</p>
    </header>

    <!-- Compact header (top bar after search) -->
    <header id="results-header" class="results-header hidden">
      <button class="home-btn" id="home-btn" title="Back to home">
        <span class="mini-wordmark">Cerulean</span>
      </button>
    </header>

    <main class="main">
      <div class="search-container">
        <div class="search-bar" id="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="q" type="text" placeholder="Search the web…" autocomplete="off" spellcheck="false">
          <button id="go" class="search-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>

        <!-- Filter chips shown after first search -->
        <div id="filters" class="filters hidden">
          <button class="chip active" id="chip-no-commerce" data-key="no_commerce" title="Demote affiliate and shopping links">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M2.5 2A1.5 1.5 0 001 3.5V5h14V3.5A1.5 1.5 0 0013.5 2h-11zM15 6H1v6.5A1.5 1.5 0 002.5 14h11a1.5 1.5 0 001.5-1.5V6zM5 8h6v1.5H5V8z"/></svg>
            No ads
          </button>
          <button class="chip active" id="chip-prefer-official" data-key="prefer_official" title="Boost .gov, .edu, and official docs">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 1L1 5v1h14V5L8 1zM2 7v5h2V7H2zm4 0v5h2V7H6zm4 0v5h2V7h-2zm-9 6v1h14v-1H1z"/></svg>
            Official sources
          </button>
          <button class="chip" id="chip-synthesize" data-key="synthesize" title="AI summary of top results">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 1.5l1.5 3.5H13l-3 2.5 1 3.5L8 9l-3 2 1-3.5L3 5h3.5L8 1.5z"/></svg>
            Summarize
          </button>
          <button class="chip" id="chip-recent" data-key="recent" title="Prefer recent results">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="8,4 8,8 11,10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Recent
          </button>
          <div class="provider-select">
            <select id="provider" title="Search provider">
              <option value="brave">Brave</option>
              <option value="serper">Serper</option>
              <option value="ddg">DuckDuckGo</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div id="status" class="status hidden"></div>

      <!-- Synthesis box -->
      <div id="synthesis" class="synthesis hidden"></div>

      <!-- Results -->
      <div id="results" class="results"></div>
    </main>

    <footer id="footer" class="footer">
      <span>Cerulean — ad-minimized, quality-ranked search</span>
    </footer>
  </div>

  <script src="/app.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Why Cerulean? - Cerulean</title><meta name="description" content="Why the search engine is called Cerulean."><script>try{var v=localStorage.getItem("cerulean-dark");if(v==="true")document.documentElement.classList.add("dark");else if(v==="false")document.documentElement.classList.add("light-forced")}catch(e){}</script><link rel="stylesheet" href="/styles.css?v=3"><link rel="stylesheet" href="/pages.css?v=2"></head>
<body class="page">
<header class="page-header"><a href="/" class="page-logo">Cerulean</a><nav class="page-nav"><a href="/methodology.html">Methodology</a><a href="/about.html">About</a><a href="/how-it-works.html">How It Works</a><a href="/privacy.html">Privacy</a><a href="/manifesto.html">Mission Statement</a></nav><button id="page-dark-btn" class="page-dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button></header>
<main class="page-main"><article>
<h1>Why Cerulean?</h1>
<p>Because it's my favorite color.</p>
<p>The serious version of this question is the <a href="/manifesto.html">Mission Statement</a>.</p>
</article></main>
<footer class="page-footer"><a href="/">Search</a> | <a href="https://github.com/garretblanchette/Cerulean-search">GitHub</a> | <a href="/why.html">Why Cerulean?</a> | Ad-free, AI-tagged search</footer>
<script>
(function(){
  var btn = document.getElementById('page-dark-btn');
  if (!btn) return;
  function syncIcon(){
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
  }
  syncIcon();
  btn.addEventListener('click', function(){
    var isDark = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', isDark);
    document.documentElement.classList.toggle('light-forced', !isDark);
    try { localStorage.setItem('cerulean-dark', isDark ? 'true' : 'false'); } catch(e){}
    syncIcon();
  });
})();
</script>
</body></html>
